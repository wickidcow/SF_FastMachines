name: Build FastMachines

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.4"
  OUTPUT_NAME: "SF_FastMachines1.0.4.jar"

concurrency:
  group: fastmachines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fastmachines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FastMachines
        uses: actions/checkout@v6
      - name: Verify immutable release publication policy
        run: python3 -m unittest discover -s scripts -p 'test_immutable_release_policy.py' -v
      - name: Verify stable Paper 26.3 compile policy
        run: python3 -m unittest discover -s scripts -p 'test_stable_paper_compile_policy.py' -v
      - name: Verify English player-facing source
        run: python3 scripts/verify_english.py .
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_FastMachines${VERSION}.jar"
          grep -Fq 'projectVersion=1.0.4' gradle.properties
          grep -Fq 'SF_FastMachines${project.version}.jar' build.gradle.kts
      - name: Verify Paper/Purpur 1.21.11 build
        run: |
          chmod +x gradlew
          ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PprojectVersion=1.0.4 --no-daemon
      - name: Verify Paper/Purpur 26.2 build
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=26.2.build.+ -PtargetJvm=25 -PprojectVersion=1.0.4 --no-daemon
      - name: Verify stable Paper 26.3 primary API source compatibility
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=26.3.build.230-stable -PtargetJvm=25 -PprojectVersion=1.0.4 --no-daemon
      - name: Build universal release JAR from 1.21.11 baseline
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PprojectVersion=1.0.4 --no-daemon
      - name: Stage and verify canonical shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          jar tf "$JAR" | grep -Fxq 'net/guizhanss/fastmachines/libs/guizhanlib/slimefun/addon/AbstractAddon.class'
          if jar tf "$JAR" | grep -q '^net/guizhanss/guizhanlib/'; then
            echo 'Unrelocated GuizhanLib classes detected in distributable JAR.' >&2
            exit 1
          fi
          javap -classpath "$JAR" net.guizhanss.fastmachines.FastMachines | grep -Fq 'extends net.guizhanss.fastmachines.libs.guizhanlib.slimefun.addon.AbstractAddon'
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          javap -verbose -classpath "dist/${OUTPUT_NAME}" net.guizhanss.fastmachines.FastMachines | grep -Fq 'major version: 65'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish distinct immutable version tag only
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          test "$GITHUB_REF" = "refs/tags/${TAG}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to republish or overwrite assets." >&2
            exit 1
          fi
          gh release create "$TAG" "$JAR" --verify-tag --repo "$GITHUB_REPOSITORY" --title "SF_FastMachines ${VERSION}" --notes "FastMachines ${VERSION}: canonical ${OUTPUT_NAME} release."
