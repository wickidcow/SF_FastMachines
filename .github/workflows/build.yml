name: Build FastMachines 26.2

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fastmachines:
    runs-on: ubuntu-latest

    steps:
      - name: Check out FastMachines
        uses: actions/checkout@v6

      - name: Verify English player-facing source
        run: python3 scripts/verify_english.py .

      - name: Check out Albion Slimefun
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun4.1
          path: .deps/Slimefun4.1

      - name: Set up Java 21 for Slimefun
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish Albion Slimefun API locally
        working-directory: .deps/Slimefun4.1
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon

      - name: Set up Java 25 for Paper 26.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test FastMachines
        run: |
          chmod +x gradlew
          ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT --no-daemon

      - name: Locate production JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'FastMachines-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          echo "FASTMACHINES_JAR=${jars[0]}" >> "$GITHUB_ENV"

      - name: Stage SF_FastMachines.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$FASTMACHINES_JAR" dist/SF_FastMachines.jar
          test -s dist/SF_FastMachines.jar
          sha256sum dist/SF_FastMachines.jar

      - name: Upload SF_FastMachines.jar
        uses: actions/upload-artifact@v7
        with:
          name: SF_FastMachines
          path: dist/SF_FastMachines.jar
          if-no-files-found: error

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          JAR="dist/SF_FastMachines.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "FastMachines $TAG"
          fi
