name: Build FastMachines 26.2

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fastmachines:
    runs-on: ubuntu-latest

    steps:
      - name: Check out FastMachines
        uses: actions/checkout@v6

      - name: Verify English player-facing source
        run: python3 scripts/verify_english.py .

      - name: Check out Albion Slimefun
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun4.1
          path: .deps/Slimefun4.1

      - name: Set up Java 21 for Slimefun
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish Albion Slimefun API locally
        working-directory: .deps/Slimefun4.1
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon

      - name: Set up Java 25 for Paper 26.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test FastMachines
        run: |
          chmod +x gradlew
          ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT --no-daemon

      - name: Locate production JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'FastMachines-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          echo "FASTMACHINES_JAR=${jars[0]}" >> "$GITHUB_ENV"

      - name: Upload FastMachines JAR
        uses: actions/upload-artifact@v7
        with:
          name: FastMachines-26.2-Albion-${{ github.run_number }}
          path: ${{ env.FASTMACHINES_JAR }}
          if-no-files-found: error
