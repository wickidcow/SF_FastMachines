name: Build FastMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.4"
  OUTPUT_NAME: "SF_FastMachines1.0.4.jar"

concurrency:
  group: fastmachines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fastmachines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FastMachines
        uses: actions/checkout@v6
      - name: Verify English player-facing source
        run: python3 scripts/verify_english.py .
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'orElse("21")' build.gradle.kts
          grep -Fq 'options.release.set(targetJvm)' build.gradle.kts
          grep -Fq 'JvmTarget.fromTarget' build.gradle.kts
          grep -Fq '1.21.11-R0.1-SNAPSHOT' build.gradle.kts
          grep -Fq 'SF_FastMachines${project.version}.jar' build.gradle.kts
          grep -Fq 'Keep the player' src/main/kotlin/net/guizhanss/fastmachines/implementation/items/machines/base/FastMachineCache.kt
      - name: Verify Paper/Purpur 1.21.11 build
        run: |
          chmod +x gradlew
          ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PprojectVersion=1.0.4 --no-daemon
      - name: Verify Paper/Purpur 26.2 build
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=26.2.build.+ -PtargetJvm=25 -PprojectVersion=1.0.4 --no-daemon
      - name: Verify Paper 26.3 alpha build
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=26.3-rc-3.build.1-alpha -PtargetJvm=25 -PprojectVersion=1.0.4 --no-daemon
      - name: Build universal release JAR from 1.21.11 baseline
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PprojectVersion=1.0.4 --no-daemon
      - name: Locate production JAR
        shell: bash
        run: |
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          echo "FASTMACHINES_JAR=$JAR" >> "$GITHUB_ENV"
      - name: Stage and verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTPUT="dist/${OUTPUT_NAME}"
          cp "$FASTMACHINES_JAR" "$OUTPUT"
          test -s "$OUTPUT"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$OUTPUT" net.guizhanss.fastmachines.FastMachines | grep -Fq 'major version: 65'
          sha256sum "$OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="FastMachines 1.0.4 adds Paper 26.3 alpha compile validation while preserving the Java 21 universal release JAR, Minecraft/Paper 1.21.11 compatibility, and Paper/Purpur 26.2 as the primary production target. The Gradle build now emits ${OUTPUT_NAME} directly without a SNAPSHOT or legacy filename."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_FastMachines $TAG" --notes "$NOTES"
          fi
