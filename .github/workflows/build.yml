name: Build FastMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.2"
  OUTPUT_NAME: "SF_FastMachines1.0.2.jar"

concurrency:
  group: fastmachines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fastmachines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FastMachines
        uses: actions/checkout@v6
      - name: Verify English player-facing source
        run: python3 scripts/verify_english.py .
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'JvmTarget.JVM_21' build.gradle.kts
          grep -Fq 'options.release.set(21)' build.gradle.kts
          grep -Fq '1.21.11-R0.1-SNAPSHOT' build.gradle.kts
      - name: Verify Paper/Purpur 1.21.11 build
        run: |
          chmod +x gradlew
          ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PprojectVersion=1.0.2 --no-daemon
      - name: Verify Paper/Purpur 26.2 build
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=26.2.build.+ -PprojectVersion=1.0.2 --no-daemon
      - name: Build universal release JAR from 1.21.11 baseline
        run: ./gradlew clean build -PslimefunVersion=ALBION-SNAPSHOT -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PprojectVersion=1.0.2 --no-daemon
      - name: Locate production JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'FastMachines-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          echo "FASTMACHINES_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Stage and verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTPUT="dist/${OUTPUT_NAME}"
          cp "$FASTMACHINES_JAR" "$OUTPUT"
          test -s "$OUTPUT"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$OUTPUT" net.guizhanss.fastmachines.FastMachines | grep -Fq 'major version: 65'
          sha256sum "$OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Compatibility release: FastMachines now emits Java/Kotlin 21 bytecode and is compile-verified against Paper/Purpur 1.21.11 and 26.2 while retaining the existing Slimefun Legacy and English-source compatibility work."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_FastMachines $TAG" --notes "$NOTES"
          fi
