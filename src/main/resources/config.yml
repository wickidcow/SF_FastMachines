# Automatic binary updates are disabled in the Albion fork so upstream builds cannot overwrite it.
auto-update: false

# Player-facing language.
lang: en-US

# Enable researches for items in this addon.
enable-researches: true

fast-machines:
  # How often menus recalculate recipes, in server ticks (20 ticks = 1 second).
  # This task now runs safely on the main server thread.
  tick-rate: 10

  # Whether crafting consumes Slimefun energy.
  use-energy: true

  # Whether the player must have researched a Slimefun output before crafting it.
  require-sf-research: false

  # Use Bukkit's strict ItemStack comparison instead of FastMachines' compatibility matcher.
  # Leave false for the broadest compatibility with Slimefun/addon recipe ingredients.
  use-bukkit-item-comparison: false

# Print additional diagnostic messages.
debug: false
